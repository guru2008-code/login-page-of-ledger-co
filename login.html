<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>

<style>
:root{
    --ink:#242226;
    --panel:#F7F4EF;
    --dark:#1B1B1F;
    --amber:#C9622A;
    --sage:#7C8B6F;
    --line:#D8D2C6;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    display:flex;
    font-family: Georgia, 'Times New Roman', serif;
    background:var(--dark);
}

.wrap{
    display:flex;
    width:100%;
    min-height:100vh;
}

/* Left brand panel */
.brand{
    flex:1 1 45%;
    background:var(--dark);
    color:var(--panel);
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    padding:56px;
}

.brand .mark{
    font-size:15px;
    letter-spacing:.04em;
    color:var(--sage);
}

.brand h1{
    font-size:42px;
    line-height:1.25;
    max-width:360px;
    font-weight:400;
}

.brand p{
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size:14px;
    color:#B8B4AE;
    max-width:320px;
    line-height:1.6;
}

/* Right form panel */
.panel{
    flex:1 1 55%;
    background:var(--panel);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:40px;
}

.form-card{
    width:100%;
    max-width:360px;
}

.form-card h2{
    font-weight:400;
    font-size:26px;
    color:var(--ink);
    margin-bottom:6px;
}

.form-card .sub{
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size:14px;
    color:#8A8580;
    margin-bottom:32px;
}

.field{
    margin-bottom:20px;
}

.field label{
    display:block;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size:13px;
    color:var(--ink);
    margin-bottom:6px;
}

.field input{
    width:100%;
    padding:12px 4px;
    border:none;
    border-bottom:1.5px solid var(--line);
    background:transparent;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size:15px;
    color:var(--ink);
    outline:none;
    transition:border-color .2s ease;
}

.field input:focus{
    border-bottom-color:var(--amber);
}

.field input::placeholder{
    color:#B5B0A8;
}

button{
    width:100%;
    padding:13px;
    margin-top:12px;
    background:var(--amber);
    color:var(--panel);
    border:none;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size:15px;
    cursor:pointer;
    transition:background .2s ease;
}

button:hover{
    background:#A94E1E;
}

.foot{
    margin-top:22px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size:13px;
    color:#8A8580;
}

.foot a{
    color:var(--sage);
    text-decoration:none;
}

@media (max-width:800px){
    .wrap{ flex-direction:column; }
    .brand{ padding:36px; }
    .brand h1{ font-size:30px; max-width:100%; }
}
</style>

</head>
<body>

<div class="wrap">
    <div class="brand">
        <div class="mark">Ledger &amp; Co.</div>
        <div>
            <h1>Welcome back. Your work is where you left it.</h1>
            <p>Sign in to pick up your open projects, notes, and the things you were in the middle of.</p>
        </div>
        <div></div>
    </div>

    <div class="panel">
        <div class="form-card">
            <h2>Sign in</h2>
            <div class="sub">Enter your details to continue</div>

            <form action="login.php" method="POST">
                <div class="field">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" placeholder="jane.doe" required>
                </div>

                <div class="field">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" required>
                </div>

                <button type="submit">Sign in</button>
            </form>

            <div class="foot">Forgot your password? <a href="#">Reset it</a></div>
        </div>
    </div>
</div>

</body>
</html>
